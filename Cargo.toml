[package]
authors = ["Michael Lodder <redmike7@gmail.com>"]
categories = ["cryptography"]
description = """A crate for working with finite fields where the modulus is of unknown order,
typtical for RSA, Paillier, Hyperelliptic curves, etc.
"""
documentation = "https://docs.rs/unknown_order"
edition = "2024"
exclude = [
    "*.sh",
    ".git",
    ".gitignore",
    ".github/",
    "tests/",
]
keywords = ["cryptography", "rsa", "bignum", "gmp", "security"]
license = "Apache-2.0 OR MIT"
name = "unknown_order"
readme = "README.md"
repository = "https://github.com/mikelodder7/unknown_order"
rust-version = "1.88"
version = "0.13.0"

[features]
default = ["openssl"]
crypto = ["dep:crypto-bigint", "dep:crypto-primes", "dep:rand"]
gmp = ["dep:rand", "dep:rug"]
openssl = ["dep:openssl", "dep:rand"]
rust = [
    "dep:rand",
    "dep:glass_pumpkin",
    "dep:num-bigint",
    "dep:num-integer",
    "dep:num-traits",
]
wasm = ["getrandom/wasm_js", "dep:wasm-bindgen"]

[dependencies]
crypto-bigint = { version = "0.7.5", default-features = false, features = [
    "alloc",
    "rand_core",
    "subtle",
    "zeroize",
], optional = true }
crypto-primes = { version = "0.7.2", default-features = false, features = [
    "alloc",
], optional = true }
digest = { version = "0.11", default-features = false }
getrandom = { version = "0.4", default-features = false, features = ["sys_rng"], optional = true }
glass_pumpkin = { version = "2.0.0-rc1", default-features = false, optional = true }
num-bigint = { version = "0.5", default-features = false, optional = true }
num-integer = { version = "0.1", default-features = false, optional = true }
num-traits = { version = "0.2", default-features = false, optional = true }
openssl = { version = "0.10.75", default-features = false, optional = true }
rand = { version = "0.10", default-features = false, features = [
    "alloc",
    "std_rng",
    "sys_rng",
], optional = true }
rand_core = { version = "0.10", default-features = false }
rug = { version = "1.28", default-features = false, features = ["integer", "std"], optional = true }
serde = { version = "1.0", default-features = false, features = ["alloc"] }
subtle = { version = "2.6", default-features = false }
thiserror = { version = "2", default-features = false }
wasm-bindgen = { version = "0.2", default-features = false, optional = true }
zeroize = { version = "1", default-features = false }

[dev-dependencies]
ciborium = "0.2"
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_test = "1.0"
serde_yaml_ng = "0.10"
toml = "1.1"
